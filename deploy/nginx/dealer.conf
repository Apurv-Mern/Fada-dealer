# FADA dealer portal — Nginx (static export)
# Serves /var/www/apps/dealer/current/build like a CRA app.
# Domain: dealer.fadaid.com  (change if needed)
#
# Install:
#   sudo cp deploy/nginx/dealer.conf /etc/nginx/sites-available/dealer
#   sudo ln -sf /etc/nginx/sites-available/dealer /etc/nginx/sites-enabled/dealer
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS:
#   sudo certbot --nginx -d dealer.fadaid.com
#
# IMPORTANT: After Certbot creates the HTTPS server block, copy the
# `location /api/` block into it as well. Profile images use
# `/api/uploads/...` same-origin URLs; without this proxy they 404 as HTML
# and the Business Profile circle stays empty.

# Shared snippets (include in both :80 and :443 server blocks)
# --- /api/ proxy (required for API + profile images) ---
# location /api/ {
#     proxy_pass https://api.fadaid.com/;
#     proxy_http_version 1.1;
#     proxy_ssl_server_name on;
#     proxy_set_header Host api.fadaid.com;
#     proxy_set_header X-Real-IP $remote_addr;
#     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#     proxy_set_header X-Forwarded-Proto $scheme;
#     # Avoid forwarding CORP that would confuse debugging; same-origin
#     # /api URLs are already dealer.fadaid.com from the browser's view.
#     proxy_hide_header Cross-Origin-Resource-Policy;
# }

server {
    listen 80;
    listen [::]:80;
    server_name dealer.fadaid.com;

    root /var/www/apps/dealer/current/build;
    index index.html;

    client_max_body_size 20m;

    # Next static assets
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Same-origin API proxy (NEXT_PUBLIC_USE_PROXY=true) + profile images.
    # Browser → /api/uploads/... → https://api.fadaid.com/uploads/...
    # Browser → /api/dealers/... → https://api.fadaid.com/dealers/...
    location /api/ {
        proxy_pass https://api.fadaid.com/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host api.fadaid.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cross-Origin-Resource-Policy;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}

