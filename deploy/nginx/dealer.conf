# FADA dealer portal — Nginx (static export)
# Serves /var/www/apps/dealer/current/build like a CRA app.
# Domain: dealer.fadaid.com  (change if needed)
#
# Install:
#   sudo cp deploy/nginx/dealer.conf /etc/nginx/sites-available/dealer
#   sudo ln -sf /etc/nginx/sites-available/dealer /etc/nginx/sites-enabled/dealer
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS:
#   sudo certbot --nginx -d dealer.fadaid.com

server {
    listen 80;
    listen [::]:80;
    server_name dealer.fadaid.com;

    root /var/www/apps/dealer/current/build;
    index index.html;

    client_max_body_size 20m;

    # Next static assets
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Same-origin API proxy (NEXT_PUBLIC_USE_PROXY=true).
    # Browser → /api/dealer/... → https://api.fadaid.com/dealer/...
    location /api/ {
        proxy_pass https://api.fadaid.com/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host api.fadaid.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}

